<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div id="wallpaper" aria-hidden="true"></div>
  <nav id="bookmarks" class="bm-bar" aria-label="Bookmarks" hidden>
    <div class="bm-items" role="menubar"></div>
    <button type="button" class="bm-item bm-overflow" title="More bookmarks" aria-haspopup="menu" hidden>»</button>
    <div class="bm-right"></div>
  </nav>

  <main>
    <nav id="grid" aria-label="Shortcuts"></nav>
    <p id="empty" hidden>No shortcuts yet. Click <strong>Add shortcut</strong> to create one.</p>
  </main>

  <footer>
    <div id="edit-tools" hidden>
      <button type="button" id="import">Import</button>
      <button type="button" id="export">Export</button>
      <button type="button" id="toggle-bookmarks">Hide bookmarks</button>
      <button type="button" id="open-wallpaper">Wallpaper…</button>
    </div>
    <button type="button" id="toggle-edit" title="Edit shortcuts" aria-pressed="false">Edit</button>
  </footer>

  <dialog id="dialog">
    <form method="dialog" id="form">
      <h2 id="dialog-title">Add shortcut</h2>
      <label>Name <input id="f-name" autocomplete="off" placeholder="Optional"></label>
      <label>URL <input id="f-url" type="text" required autocomplete="off" placeholder="example.com"></label>
      <label>Icon URL <input id="f-icon" autocomplete="off" placeholder="Optional — defaults to the site's favicon"></label>
      <div class="actions">
        <button type="button" id="delete" class="danger">Delete</button>
        <span class="spacer"></span>
        <button type="button" id="cancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="bm-dialog">
    <form method="dialog" id="bm-form">
      <h2 id="bm-dialog-title">Edit bookmark</h2>
      <label>Name <input id="bm-f-name" autocomplete="off"></label>
      <label id="bm-f-url-label">URL <input id="bm-f-url" type="text" autocomplete="off" placeholder="example.com"></label>
      <div class="actions">
        <span class="spacer"></span>
        <button type="button" id="bm-cancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="wp-dialog">
    <form method="dialog">
      <h2>Wallpaper</h2>
      <div id="wp-preview"><span id="wp-none">No wallpaper</span></div>
      <div class="actions" id="wp-actions">
        <button type="button" id="wp-choose">Choose image…</button>
        <button type="button" id="wp-remove" class="danger">Remove</button>
      </div>
      <label>Fit
        <select id="wp-fit">
          <option value="cover">Fill the page</option>
          <option value="contain">Fit inside the page</option>
        </select>
      </label>
      <label>Dim <output id="wp-dim-value"></output>
        <input type="range" id="wp-dim" min="0" max="70" step="5">
      </label>
      <p class="hint">You can also drop an image file anywhere on the page.</p>
      <div class="actions">
        <span class="spacer"></span>
        <button type="submit" class="primary">Done</button>
      </div>
    </form>
  </dialog>
  <input type="file" id="wp-file" accept="image/*" hidden>

  <div id="bm-toast" role="status" hidden>
    <span id="bm-toast-text"></span>
    <button type="button" id="bm-undo">Undo</button>
  </div>

  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <script src="newtab.js"></script>
  <script src="bookmarks.js"></script>
  <script src="bookmarks-edit.js"></script>
  <script src="wallpaper.js"></script>
</body>
</html>
